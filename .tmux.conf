# term colors
set-option -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# mouse
set -g mouse on

# Use zsh as the shell.
set-option -g default-shell /bin/zsh

# for neovim
set -sg escape-time 1

# vi for copy mode
setw -g mode-keys vi

# Enable window titles
set -g set-titles on

# status bar with load and time (Rose Pine Moon)
# Use the terminal default background so Ghostty opacity and Neovim transparency match.
# Previous indicator colors: tmux=gold=#f6c177, cpu=foam=#9ccfd8, memory=gold=#f6c177, disk=love=#eb6f92
set -g status-left '#[bg=default,fg=#c4a7e7]   '
set -g status-style 'bg=default fg=#e0def4'
set -g status-left-style 'bg=default fg=#e0def4'
# set -g status-right '#[fg=#9ccfd8]  #(cat /proc/loadavg | awk "{printf \"%.2f\", \$1}")  #[fg=#f6c177]  #(free -h | awk "NR==2{print \$3}") #[fg=#eb6f92,bold]#(date +" %H:%M ")'
set -g status-right '#[bg=default,fg=#3e8fb0] #(cat /proc/loadavg | awk "{printf \"%.2f\", \$1}")  #[fg=#9ccfd8] #(free -h | awk "NR==2{print \$3}") #[fg=#ea9a97,bold]  #(df -BG --output=used,avail / | tail -1 | xargs | tr " " / | tr -d G | sed "s/$/GB/")'
set -g window-status-current-format '#[bg=default,fg=#c4a7e7,bold]  #[fg=#e0def4,underscore]#I:#W'
set -g window-status-format '#[bg=default,fg=#6e6a86] #I:#W'
set -g message-style 'bg=default,fg=#e0def4'

set -g status-interval 3
set -g status-keys vi
set -g status-position top

# Window index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-option -g focus-events on

# Increase history
set -g history-file ~/.tmux.history
set -g history-limit 100000

# Reload configuration
bind-key -r r source-file ~/.tmux.conf
